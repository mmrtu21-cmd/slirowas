<!DOCTYPE html>
<html lang="ru">
<head>

<title>Слизарио</title>
<style>
:root{--bg:#e8eefb;--out:#c5cfe6;--grid:rgba(20,35,80,.09);--fg:#10182e;--panel:rgba(255,255,255,.88);--glass:rgba(255,255,255,.42);--gb:rgba(255,255,255,.75);--gs:rgba(40,60,110,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg)}
body{position:relative;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#hud{position:absolute;top:10px;left:calc(12px + env(safe-area-inset-left,0px));padding:7px 16px;border-radius:999px;background:var(--panel);font-size:18px;font-weight:600;pointer-events:none;border:1px solid var(--gb)}
#hint{position:absolute;left:0;right:0;bottom:30%;text-align:center;font-size:15px;opacity:.85;pointer-events:none;animation:f 1s 5s forwards}
@keyframes f{to{opacity:0}}
#bst{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:24px;width:94px;height:94px;padding:0;border-radius:50%;border:1px solid var(--gb);background:var(--glass);color:var(--fg);font:700 15px -apple-system,system-ui,sans-serif;letter-spacing:.5px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 28px var(--gs);touch-action:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s}
#bst.on{transform:scale(.93);background:rgba(10,132,255,.5)}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:26px;width:136px;height:136px;box-sizing:border-box;border-radius:50%;border:1px solid var(--gb);background:var(--glass);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 8px 28px var(--gs);opacity:.8;pointer-events:none;transition:opacity .15s}
#joy.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.98),rgba(255,255,255,.55) 55%,rgba(255,255,255,.3));border:1px solid var(--gb);box-shadow:0 4px 14px var(--gs),inset 0 1px 2px #fff}

#ov.show,#menu.show,#shp.show{display:flex}
.card{background:var(--panel);padding:30px 28px;border-radius:34px;text-align:center;min-width:230px;border:1px solid var(--gb)}
.card h1{margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.card p{margin:0 0 18px;font-size:20px}
.go{display:block;width:100%;box-sizing:border-box;margin:0 0 10px;font:600 17px -apple-system,system-ui,sans-serif;padding:15px 26px;border-radius:999px;color:#fff;border:1px solid rgba(255,255,255,.5);background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%),rgba(10,132,255,.9);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),0 6px 18px rgba(10,132,255,.4);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.go:active{transform:scale(.96)}
.go.alt{color:var(--fg);background:var(--glass);border:1px solid var(--gb);box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}
#menu .card{width:min(86vw,320px);box-sizing:border-box}
#menu h1{margin-bottom:16px;font-size:34px}
#nick{display:block;box-sizing:border-box;width:100%;margin:0 0 14px;padding:13px 14px;border-radius:999px;border:1px solid var(--gb);background:var(--glass);color:var(--fg);font:600 18px -apple-system,system-ui,sans-serif;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
#nick::placeholder{color:var(--fg);opacity:.45}
#nick:focus{box-shadow:0 0 0 3px rgba(10,132,255,.5)}
#lb{position:absolute;top:8px;right:calc(8px + env(safe-area-inset-right,0px));width:104px;box-sizing:border-box;padding:4px 5px;border-radius:16px;background:var(--panel);border:1px solid var(--gb);font-size:9px;line-height:1.35;pointer-events:none}
#lb b{display:block;text-align:center;font-size:10px}
#lb .r{display:flex;justify-content:space-between;gap:4px;padding:0 2px}
#lb .r span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .me{font-weight:700;background:rgba(10,132,255,.32);border-radius:4px}
#rk{margin-top:3px;text-align:center;opacity:.75}
body.m #lb,body.m #hud,body.m #bst,body.m #joy,body.m #hint{display:none}
#shp .card{width:min(92vw,360px);box-sizing:border-box;max-height:88%;display:flex;flex-direction:column;padding:22px 16px;background:var(--bg)}
.sc{overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;margin:0 0 12px;flex:1;min-height:0}
#sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:8px;border-radius:16px;background:rgba(127,127,127,.15);border:1px solid var(--gb);font-size:13px;font-weight:600;cursor:pointer}
.tile.sel{box-shadow:0 0 0 2px #0a84ff;background:rgba(10,132,255,.14)}
.tile canvas{width:100%;height:auto;display:block}
.tg{font-size:12px;opacity:.75;margin-top:4px}
#coins{font-size:18px;font-weight:700;margin:0 0 10px}
#cn{font-size:15px;opacity:.8;margin-top:-10px}
#pvc{width:100%;height:auto;display:block;border-radius:16px;background:rgba(127,127,127,.14);margin-bottom:8px}
#pvn{font-weight:700;font-size:16px;margin-bottom:8px}
#pva{margin-bottom:10px}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="g"></canvas><canvas id="l"></canvas>
<div id="hud">Счёт: <b id="sc">10</b></div>
<div id="lb"><b>Топ 10</b><div id="lbl"></div><div id="rk"></div></div>
<div id="hint">Джойстик слева — управление, BOOST справа — ускорение (на ПК: мышь и Пробел)</div>
<div id="joy"><div id="knob"></div></div>
<button id="bst">BOOST</button>
<div id="ov"><div class="card"><h1>Игра окончена</h1><p>Ваш счёт: <b id="fs">0</b></p><p id="cn"></p><button id="again" class="go">Играть снова</button><button id="tomenu" class="go alt">В меню</button></div></div>
<div id="menu" class="show"><div class="card"><h1>Слизарио</h1><input id="nick" maxlength="14" placeholder="Ваш ник" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="play" class="go">Играть</button><button id="shop" class="go alt">Магазин скинов</button><button id="vw" class="go alt">Вид: 3D</button></div></div>
<div id="shp"><div class="card"><h1>Магазин</h1><p id="coins"></p><canvas id="pvc" width="320" height="104"></canvas><div id="pvn"></div><button id="pva" class="go"></button><div class="sc"><div id="sg"></div></div><button id="sback" class="go alt">Назад</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const W=6000,NF=1500,NB=28,TAU=Math.PI*2;
const NAMES=['Doge','Cheems','Stonks','Gigachad','Sigma_Snek','Skibidi','NPC_4821','Amogus','Rizzler','Bruh_Moment','Nyan','Karen_WiFi','OK_Boomer','xX_Noodle_Xx','Press_F','Wasted','Sus_Potato','Mr_Banana','Sir_Hiss','Chill_Guy','Not_A_Bot','404_Brain','Ohio_Guy','Based','Yeet','Sheesh','Big_Chungus','Lil_Snek','Capybara','Poggers','Vibe_Check','Rickrolled','Epic_Fail','Doomscroll','Aura_+1000','Mewing','Sneaky_Beaky','Spaghetti','Banana_Phone',
'Ждун','Кринж','Вайб','Рофл','Жиза','Хайп','Дед_Инсайд','Чебурашка','Колобок','Огурчик','Пельмень','Доширак','Гречка','Хлебушек','Базару_Ноль','Мамкин_Хакер','Красавчик','Эщкере','Вжух','Зачёт','Шаурма_Бог','Тапок','Лунтик','Кабачок','Котлета','Ща_Покажу','Ёжик','Печенька','Ну_Погоди','Не_Тормози','Лютый_Вайб','Сырок','Поехали','Ждём_Лето','Босс_Пельмень','Кот_Учёный','Делай_Норм','Дядя_Стёпа','Ага_Угу','Жи_Есть','Ну_Такое','Не_Баг_А_Фича','Бегу_Бегу','Ёлки_Палки'];
let NICK='Игрок',pool=[];
const COL=['#ff4d6d','#ffd23f','#2ee6f2','#7cff5b','#b36bff','#ff9a1f','#4d8dff','#ff6bd6'];
const SH=COL.map(c=>{const n=parseInt(c.slice(1),16);return `rgb(${(n>>16&255)*.75|0},${(n>>8&255)*.75|0},${(n&255)*.75|0})`});
const spr=COL.map(c=>{const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'#fff');r.addColorStop(.18,c);r.addColorStop(.4,c);r.addColorStop(.55,c+'88');r.addColorStop(1,c+'00');g.fillStyle=r;g.fillRect(0,0,64,64);return s});
const hs=(n,f)=>Array.from({length:n},(_,i)=>f(i));
const SK=[
 {n:'Классика',p:0},
 {n:'Радуга',p:40,t:hs(24,i=>`hsl(${i*15},90%,58%)`)},
 {n:'Неон',p:60,t:['#2ee6f2','#2ee6f2','#ff3df2','#ff3df2']},
 {n:'Зебра',p:60,t:['#fff','#fff','#222','#222']},
 {n:'Арбуз',p:80,t:['#34c759','#34c759','#14532d','#ff4d6d']},
 {n:'Огонь',p:100,t:hs(24,i=>`hsl(${Math.abs(12-i)*4.6},100%,55%)`)},
 {n:'Лёд',p:100,t:hs(12,i=>`hsl(200,90%,${52+Math.abs(6-i)*5}%)`)},
 {n:'Золото',p:160,t:['#ffe27a','#ffd23f','#e0a915','#c98f0a','#e0a915','#ffd23f']},
 {n:'Космос',p:200,t:['#7c3aed','#7c3aed','#4338ca','#1e1b4b','#4338ca']}
];
const skin=(s,k)=>{s.sk=k;s.tb=SK[k].t||[COL[s.ci],COL[s.ci],SH[s.ci],SH[s.ci]]};
let COINS=50,OWN=[0],SKIN=0,M3=1;
try{const d=JSON.parse(localStorage.getItem('slz')||'{}');if(d.c!=null)COINS=d.c;if(d.o)OWN=d.o;if(d.s!=null)SKIN=d.s;if(d.m!=null)M3=d.m?1:0}catch(_){}
const sv=()=>{try{localStorage.setItem('slz',JSON.stringify({c:COINS,o:OWN,s:SKIN,m:M3?1:0}))}catch(_){}};
const cv=document.getElementById('c'),cx=cv.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v;
const cs=getComputedStyle(document.documentElement);
let dirty=1,CELL=60,lq=0,dcap=1.5,ft=0,fc=0,cr={left:0,top:0},vw,vh,dpr,BG,OUT,GR,food,snakes,rq,pl,state,tm=0,zoom=1,cam={x:0,y:0},sid=-1,bt=0,kb=0,ls=-1,fr=0,last=0;
function th(){BG=cs.getPropertyValue('--bg').trim();OUT=cs.getPropertyValue('--out').trim();GR=cs.getPropertyValue('--grid').trim()}
function rs(){dpr=Math.min(devicePixelRatio||1,dcap);vw=cv.clientWidth;vh=cv.clientHeight;cr=cv.getBoundingClientRect();dirty=1;cv.width=vw*dpr;cv.height=vh*dpr;th()}
const geo=s=>{s.r=Math.min(15,8+Math.sqrt(s.mass)*.35);s.sp=s.r*.7};
const cnt=s=>Math.min(110,Math.floor(10+Math.sqrt(s.mass)*2.6));
const tz=()=>Math.sqrt(vw*vh)/600/(1+(pl.r-8)*.05+Math.sqrt(pl.mass)*.004);
function addFood(x,y,v,ci,w){food.push({x,y,v,ci,r:Math.min(14,3+v*1.6),p:Math.random()*6.3,w:tm+(w||0)})}
const natural=()=>addFood(rnd(40,W-40),rnd(40,W-40),rnd(1,2),Math.random()*8|0);
function mk(x,y,a,mass,ci,bot){
 const s={a,ta:a,mass,ci,bot,alive:1,segs:[],bq:0,boost:0,inv:2,th:0,tx:0,ty:0,go:0,fl:0,want:a,vt:0,bo:0};
 geo(s);
 skin(s,0);for(let i=0,n=cnt(s);i<n;i++)s.segs.push({x:x-Math.cos(a)*s.sp*i,y:y-Math.sin(a)*s.sp*i});
 return s;
}
function spot(){let x,y,t=0;do{x=rnd(300,W-300);y=rnd(300,W-300);t++}while(t<30&&snakes.some(o=>o.segs.some((g,i)=>i%4==0&&(g.x-x)**2+(g.y-y)**2<360000)));return[x,y]}
function nm(){for(let t=0;t<9;t++){if(!pool.length)pool=NAMES.slice().sort(()=>Math.random()-.5);const n=pool.pop();if(n!==NICK&&!snakes.some(o=>o.name===n))return n}return 'Bot'+(Math.random()*99|0)}
const bot=()=>{const[x,y]=spot(),s=mk(x,y,rnd(0,TAU),rnd(10,40),(3+Math.random()*7|0)%8,1);s.name=nm();skin(s,Math.random()<.3?0:Math.random()*SK.length|0);return s};
function kill(s){
 s.alive=0;
 const n=s.segs.length,c=cl(Math.ceil(s.mass/4),6,80),k=Math.max(1.5,s.mass*.85/c);
 for(let i=0;i<c;i++){const g=s.segs[Math.min(n-1,(i*n/c)|0)];addFood(cl(g.x+rnd(-12,12),20,W-20),cl(g.y+rnd(-12,12),20,W-20),k,s.ci)}
 if(food.length>NF*2)food.splice(0,food.length-NF*2);
 if(s===pl){state=1;$('fs').textContent=Math.floor(s.mass);const gc=Math.floor(s.mass/4);COINS+=gc;sv();$('cn').textContent='+'+gc+' 🪙 · всего '+COINS;$('ov').classList.add('show')}
 else rq.push(tm+3);
}
function move(s,dt){
 const sg=s.segs,h=sg[0],b=s.boost&&s.mass>12;
 const d=Math.atan2(Math.sin(s.ta-s.a),Math.cos(s.ta-s.a)),tr=((s.bot?3.0:5.2)-s.r*.07)*dt;
 s.a+=cl(d,-tr,tr);
 const v=(b?(s.bot?250:330):(s.bot?138:185))*dt;
 h.x=cl(h.x+Math.cos(s.a)*v,0,W);h.y=cl(h.y+Math.sin(s.a)*v,0,W);
 if(b){s.bq+=dt;const bi=s.bot?.16:.22;if(s.bq>bi){s.bq-=bi;s.mass-=1;const t=sg[sg.length-1];addFood(t.x+rnd(-4,4),t.y+rnd(-4,4),1,s.ci,1.2)}}
 geo(s);
 const n=cnt(s);
 while(sg.length<n){const t=sg[sg.length-1];sg.push({x:t.x,y:t.y})}
 while(sg.length>n)sg.pop();
 for(let i=1;i<sg.length;i++){const p=sg[i-1],q=sg[i],dx=p.x-q.x,dy=p.y-q.y,e=Math.hypot(dx,dy);if(e>s.sp){const k=(e-s.sp)/e;q.x+=dx*k;q.y+=dy*k}}
}
function eat(s,dt){
 const h=s.segs[0],R=s.r+(s.bot?50:62),R2=R*R,E=s.r+(s.bot?4:6);
 for(let i=food.length-1;i>=0;i--){
  const f=food[i];if(tm<f.w)continue;
  const dx=h.x-f.x,dy=h.y-f.y,q=dx*dx+dy*dy;
  if(q>R2)continue;
  if(q<(E+f.r*.5)**2){s.mass+=f.v;food[i]=food[food.length-1];food.pop()}
  else{const d=Math.sqrt(q),k=Math.min(1,360*dt/d);f.x+=dx*k;f.y+=dy*k}
 }
}
function hit(){
 const dead=[];
 for(const a of snakes){
  if(a.inv>0)continue;
  const h=a.segs[0];
  out:for(const b of snakes){
   if(b===a||b.inv>0)continue;
   const R=(a.r+b.r)*.8,R2=R*R,g=b.segs,bl=g.length*b.sp+R;if((h.x-g[0].x)**2+(h.y-g[0].y)**2>bl*bl)continue;
   for(let i=0;i<g.length;i++){const dx=h.x-g[i].x,dy=h.y-g[i].y;if(dx*dx+dy*dy<R2){dead.push(a);break out}}
  }
 }
 dead.forEach(kill);
}
const ad=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
function risk(s,x,y){
 let p=0;
 if(x<80||x>W-80||y<80||y>W-80)p+=6;
 for(const o of snakes){
  if(o===s||o.inv>0)continue;
  const g=o.segs,R=(s.r+o.r)*.95+4,R2=R*R;const bl=g.length*o.sp+R+60;if((g[0].x-x)**2+(g[0].y-y)**2>bl*bl)continue;
  for(let i=0;i<g.length;i+=2){const dx=g[i].x-x,dy=g[i].y-y;if(dx*dx+dy*dy<R2){p+=i?4:7;break}}
 }
 return p;
}
function ai(s,dt){
 const h=s.segs[0];s.th-=dt;s.vt-=dt;s.bo-=dt;s.boost=s.bo>0?1:0;
 if(s.th<=0){
  s.th=rnd(.25,.45);
  let tg=null,pr=null,bd=90000;
  for(const o of snakes){
   if(o===s||o.inv>0||o.mass*2.2>s.mass||(o===pl&&o.mass<25))continue;
   const p=o.segs[0],dx=p.x-h.x,dy=p.y-h.y,d=dx*dx+dy*dy;
   if(d<bd){bd=d;pr=o}
  }
  if(pr){
   const p=pr.segs[0],d=Math.sqrt(bd),k=Math.min(280,d*.8);
   tg={x:p.x+Math.cos(pr.a)*k,y:p.y+Math.sin(pr.a)*k};
   if(d<200&&s.mass>60)s.bo=.4;
  }else{
   let bs=0;
   for(const f of food){
    if(tm<f.w)continue;
    const dx=f.x-h.x,dy=f.y-h.y,d=dx*dx+dy*dy;
    if(d>250000)continue;
    const v=f.v/(1+Math.sqrt(d)/110);
    if(v>bs){bs=v;tg=f}
   }
  }
  s.want=tg?Math.atan2(tg.y-h.y,tg.x-h.x):s.want+rnd(-.9,.9);
 }
 if(s.vt<=0){
  s.vt=lq?.45:.32;
  let best=1e9,ba=s.ta,r0=0;
  for(const d of lq?[0,.6,-.6,1.3,-1.3,2.4]:[0,.45,-.45,.9,-.9,1.4,-1.4,2.2]){
   const a=s.want+d,ca=Math.cos(a),sa=Math.sin(a);
   let c=ad(a,s.want)*.9+ad(a,s.a)*.5;
   for(let L=40;L<=100;L+=60)c+=risk(s,h.x+ca*L,h.y+sa*L);
   if(d===0)r0=c;
   if(c<best){best=c;ba=a}
  }
  s.ta=Math.random()<.14?s.want:ba;
  if(r0>8&&s.mass>90)s.bo=.3;
 }
}
/* ---------- real 3D (Three.js) ---------- */
const HAS3=typeof THREE!=='undefined',G=$('g'),LC=$('l');
let gOn=0,bad3=0,R3,S3,C3,SG,BK={},EW,EP,SHM,lcx,key3='';
const D3=HAS3?new THREE.Object3D():0,V3=HAS3?new THREE.Vector3():0,CC={};
const col3=c=>CC[c]||(CC[c]=new THREE.Color(c));
const put=(m,i,x,y,z,s)=>{D3.position.set(x,y,z);D3.scale.setScalar(s);D3.updateMatrix();m.setMatrixAt(i,D3.matrix)};
function bk(c,cap,basic){const k=(basic?'b':'l')+c;let o=BK[k];if(!o){o=new THREE.InstancedMesh(SG,basic?new THREE.MeshBasicMaterial({color:col3(c)}):new THREE.MeshLambertMaterial({color:col3(c)}),cap);o.frustumCulled=false;o.n=0;o.count=0;S3.add(o);BK[k]=o}return o}
function init3(){
 R3=new THREE.WebGLRenderer({canvas:G,antialias:!lq});
 S3=new THREE.Scene();S3.background=new THREE.Color(0xbcd6ff);S3.fog=new THREE.Fog(0xbcd6ff,1400,4200);
